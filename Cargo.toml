[package]
authors = ["Hugo Freire <hfreire@abajar.com>"]
description = "Implementation of NeuroEvolution of Augmenting Topologies NEAT http://nn.cs.utexas.edu/downloads/papers/stanley.ec02.pdf with a Continuous-Time Recurrent Neural Networks"
documentation = "https://github.com/TLmaK0/rustneat"
keywords = ["neuroevolution", "neat", "aumenting-topologies", "genetic", "algorithm"]
license = "MIT"
name = "rustneat"
repository = "https://github.com/TLmaK0/rustneat"
version = "0.3.0"
edition = "2018"

[dependencies]
conv = "0.3.2"
crossbeam = "0.8"
num_cpus = "1.0"
rand = "0.8"
rand_chacha = "0.3"
rulinalg = "0.3.4"

rusty_dashed = { version = "0.3.0", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
# float_roundtrip: champion.json must give back the exact weights
serde_json = { version = "1.0", features = ["float_roundtrip"], optional = true }

pyo3 = { version = "0.22", features = ["auto-initialize"], optional = true }
ctrlc = { version = "3.1.4", optional = true }

[dev-dependencies]
# The lunar lander example's files (examples/lunar_lander_common) are tested
# without the `openai` feature (tests/lunar_lander_tests.rs).
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
# Opens the telemetry dashboard in a browser (examples/telemetry_helper).
open = "1.2.1"

[features]
default = []
telemetry = ["rusty_dashed", "serde", "serde_json"]
openai = ["pyo3", "ctrlc", "serde", "serde_json"]
# CTRNN state telemetry; needs the telemetry dashboard.
ctrnn_telemetry = ["telemetry"]

[[example]]
name = "openai"
required-features = ["openai"]

[[example]]
name = "openai_lunar_lander"
required-features = ["openai"]

[[example]]
name = "simple_sample"

[[example]]
name = "function_approximation"

[[example]]
name = "ctrnn"

[[example]]
name = "test_champion"
required-features = ["openai"]

[[example]]
name = "xor_bench"
